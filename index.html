
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTags Photo Patcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-xl max-w-lg w-full space-y-6">
        <div class="flex items-center gap-4 border-b border-slate-100 pb-6">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shadow-inner shrink-0">
                <i data-lucide="wrench" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-800">Photo Patcher</h1>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Admin Database Utility</p>
            </div>
        </div>

        <div id="loading-state" class="py-12 text-center text-slate-400 font-bold uppercase tracking-widest flex flex-col items-center justify-center gap-3">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-emerald-500"></i>
            Connecting to Database...
        </div>

        <form id="patch-form" class="space-y-6 hidden">
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Select Completed Match</label>
                <select id="match-selector" required class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-700 outline-none focus:border-emerald-500 cursor-pointer text-sm">
                    <option value="">Loading matches...</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 flex items-center gap-1">
                    <i data-lucide="camera" class="w-3 h-3"></i> New Photo to Upload
                </label>
                <input type="file" id="new-photo" required accept="image/*" class="w-full p-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl text-sm text-slate-500 outline-none cursor-pointer">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-sm uppercase tracking-[0.2em] hover:bg-black transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="upload-cloud" class="w-5 h-5"></i> Patch Photo
            </button>
        </form>
        
        <div id="success-state" class="hidden py-8 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="check-circle-2" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-black text-slate-800 tracking-tight">Photo Patched!</h3>
            <p class="text-sm font-medium text-slate-500">The database has been updated.</p>
            <button onclick="location.reload()" class="mt-4 px-6 py-3 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-xs uppercase tracking-widest text-slate-600 transition-colors">Patch Another</button>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 z-[1000] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const DATABASE_FOLDER_NAME = 'friday-harbour-battle-tags';

        // Setup Config matching your main app
        let firebaseConfig;
        let activeAppId;
        try {
            firebaseConfig = JSON.parse(__firebase_config);
            activeAppId = typeof __app_id !== 'undefined' ? __app_id : DATABASE_FOLDER_NAME;
        } catch (e) {
            firebaseConfig = {
                apiKey: "AIzaSyDf_1RE4hscqVVbHoN7Vvqoylj8elWLUn4",
                authDomain: "battletags-27390.firebaseapp.com",
                projectId: "battletags-27390",
                storageBucket: "battletags-27390.firebasestorage.app",
                messagingSenderId: "930795580018",
                appId: "1:930795580018:web:b82b95d64572483f85f0eb"
            };
            activeAppId = DATABASE_FOLDER_NAME;
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Toast Helper
        window.showToast = function(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-6 py-4 rounded-2xl font-black text-xs uppercase tracking-widest text-white shadow-2xl transition-all duration-300 ${isError ? 'bg-rose-600' : 'bg-slate-900'}`;
            t.innerHTML = msg; 
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        // Image Compression Helper
        const compressImage = async (file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const img = new Image(); img.src = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(img.src);
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; } } 
                    else { if (height > maxHeight) { width = Math.round(width * (maxHeight / height)); height = maxHeight; } }
                    const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('Canvas compression failed')); }, 'image/jpeg', quality);
                };
                img.onerror = (error) => reject(error);
            });
        };

        // Initialize and Load Data
        async function init() {
            lucide.createIcons();
            try {
                // Auth first
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Fetch all matches
                const matchesRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'matches');
                const snapshot = await getDocs(matchesRef);
                
                // Filter for completed matches and sort by date descending
                const matches = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(m => m.status === 'completed' && m.winner)
                    .sort((a, b) => new Date(b.date) - new Date(a.date));

                const selector = document.getElementById('match-selector');
                selector.innerHTML = '<option value="">Select a match to patch...</option>';

                matches.forEach(m => {
                    const isTie = m.winner === 'Tie';
                    const label = isTie 
                        ? `${m.date} | ${m.player1} Tied ${m.player2}` 
                        : `${m.date} | ${m.winner} Defeated ${m.loser}`;
                    
                    const hasPhotoIndicator = m.photoUrl ? ' (Has Photo)' : ' (No Photo)';
                    selector.add(new Option(label + hasPhotoIndicator, m.id));
                });

                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('patch-form').classList.remove('hidden');

            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('loading-state').innerHTML = `<div class="text-rose-500">Failed to connect to database.</div>`;
            }
        }

        // Handle Submission
        document.getElementById('patch-form').onsubmit = async function(e) {
            e.preventDefault();
            const matchId = document.getElementById('match-selector').value;
            const photoInput = document.getElementById('new-photo');
            const btn = document.getElementById('submit-btn');

            if (!matchId) return showToast("Please select a match.", true);
            if (photoInput.files.length === 0) return showToast("Please select an image.", true);

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
            lucide.createIcons();

            try {
                // 1. Compress Image
                const file = photoInput.files[0];
                const compressedBlob = await compressImage(file, 1200, 1200, 0.7);
                
                // 2. Upload to Storage
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Uploading...`;
                const safeFileName = file.name.replace(/[^a-zA-Z0-9]/g, '_') + '.jpg';
                const storageRef = ref(storage, `match_photos/${activeAppId}/${matchId}_PATCH_${Date.now()}_${safeFileName}`);
                await uploadBytes(storageRef, compressedBlob);
                const photoUrl = await getDownloadURL(storageRef);

                // 3. Update Firestore Document
                btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Patching DB...`;
                await updateDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'matches', matchId), {
                    photoUrl: photoUrl
                });

                document.getElementById('patch-form').classList.add('hidden');
                document.getElementById('success-state').classList.remove('hidden');
                lucide.createIcons();

            } catch (error) {
                console.error("Patch error:", error);
                showToast("Failed to patch match. See console.", true);
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="upload-cloud" class="w-5 h-5"></i> Patch Photo`;
                lucide.createIcons();
            }
        };

        // Boot
        init();
    </script>
</body>
</html>
